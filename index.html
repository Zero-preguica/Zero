<style>
:root{
  --bg:#161513; --steel:#211F1C; --steel2:#2B2925;
  --rust:#D9722C; --rust-dim:#8C4E22; --iron:#8B8578; --chalk:#F3EFE6; --dim:#928C7E;
  --ok:#7C9A46; --stripe:#232019;
}
*{box-sizing:border-box}
html{height:100%;background:var(--bg)}
body{
  min-height:100%;margin:0;background:
    repeating-linear-gradient(135deg, transparent 0 26px, rgba(217,114,44,.035) 26px 30px),
    var(--bg);
  color:var(--chalk);
  font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:480px;margin:0 auto;padding:0 20px 60px}
.hero{
  padding:34px 0 22px;position:relative;
}
.hero .tag{
  display:inline-flex;align-items:center;gap:8px;color:var(--rust);
  font-family:'Oswald',sans-serif;font-weight:600;font-size:.78rem;letter-spacing:.14em;margin-bottom:6px;
}
.hero .tag svg{width:16px;height:16px;flex-shrink:0}
h1{
  font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;
  font-size:2.3rem;line-height:.96;margin:0 0 8px;letter-spacing:.01em;color:var(--chalk);
}
h1 span{color:var(--rust)}
.sub{color:var(--iron);font-size:.92rem;margin:0;max-width:34ch}
.card{
  background:var(--steel);border:1px solid #3a3630;border-radius:6px;padding:18px;margin-bottom:14px;
  border-left:3px solid var(--rust-dim);
}
.card h2{
  font-family:'Oswald',sans-serif;font-size:.95rem;margin:0 0 14px;color:var(--rust);
  font-weight:600;text-transform:uppercase;letter-spacing:.06em;
}
.who{display:flex;gap:8px;margin-bottom:8px}
.who button{
  flex:1;background:var(--steel2);border:1px solid #403c34;color:var(--iron);
  font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.03em;
  font-size:.88rem;border-radius:5px;padding:11px;cursor:pointer;
}
.who button.on{background:var(--rust);color:#1A1008;border-color:var(--rust)}
.hint{font-size:.78rem;color:var(--dim);margin:0 0 4px}
form .row{display:flex;gap:10px;margin-bottom:12px}
form input[type=date],form input[type=time]{
  flex:1;background:var(--steel2);border:1px solid #403c34;border-radius:5px;
  padding:10px;color:var(--chalk);font-family:'Inter',sans-serif;font-size:.9rem;color-scheme:dark;
}
button{border:none;border-radius:5px;font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.03em;cursor:pointer;font-size:.92rem;padding:12px 16px;text-transform:uppercase}
.btn-add{width:100%;background:var(--rust);color:#1A1008;box-shadow:0 2px 0 var(--rust-dim)}
.btn-add:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.btn-notif{width:100%;background:transparent;color:var(--iron);border:1px solid #403c34;margin-top:10px}
.item{background:var(--steel2);border-radius:6px;padding:14px 16px;margin-bottom:10px;border:1px solid #3a3630}
.item .top{display:flex;align-items:center;gap:14px}
.item .day{
  width:52px;height:52px;border-radius:50%;flex-shrink:0;
  background:var(--rust);color:#1A1008;border:4px solid #2B2925;outline:2px solid var(--rust-dim);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:'Oswald',sans-serif;font-weight:700;font-size:1.05rem;line-height:1;
}
.item .day small{font-size:.55rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
.item.pending .day{background:var(--steel);color:var(--chalk);border-color:#3a3630;outline-color:#403c34}
.item .info{flex:1;min-width:0}
.item .time{font-family:'Oswald',sans-serif;font-weight:600;font-size:1.15rem}
.item .note{color:var(--dim);font-size:.82rem;margin-top:1px}
.item .actions{display:flex;gap:6px}
.item .actions button{padding:0;width:36px;height:36px;background:var(--steel);border:1px solid #403c34;color:var(--iron);font-size:1rem}
.item .actions .del{color:#C1583B}
.confirm-row{display:flex;gap:8px;margin-top:12px}
.confirm-row button{flex:1;padding:10px}
.btn-yes{background:var(--ok);color:#12200E}
.btn-no{background:transparent;border:1px solid #4a463d;color:var(--dim)}
.empty{color:var(--dim);text-align:center;padding:30px 10px;font-size:.9rem}
.status{font-size:.78rem;color:var(--dim);text-align:center;margin-top:10px}
.status.warn{color:var(--rust)}
.splash{
  position:fixed;inset:0;z-index:999;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  transition:opacity .5s ease;
}
.splash.hide{opacity:0;pointer-events:none}
.splash svg{width:220px;height:auto}
.splash .rig{animation:lift 1.1s ease-in-out infinite}
.splash .txt{
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.12em;
  color:var(--rust);font-size:.85rem;font-weight:600;
}
@keyframes lift{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
</style>
</head>

const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJsaWVzbm9zZnRqaHRydmZiaGVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2MzYxNDAsImV4cCI6MjA5NzIxMjE0MH0.jmaqLfm4wkamYIQaEIHTm1XFipftsPx1X0DotKbEYfk';
const supa = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const TABLE = 'treino_sessions';

const MONTHS=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
let items = [];
let me = localStorage.getItem('td_me') || null; // 'jose' | 'bia'
const seenProposal = new Set(JSON.parse(localStorage.getItem('td_seen_proposal')||'[]'));
const seenResponse = new Set(JSON.parse(localStorage.getItem('td_seen_response')||'[]'));
const NAME = {jose:'José', bia:'Bia'};

function renderWho(){
  document.getElementById('whoJose').classList.toggle('on', me==='jose');
  document.getElementById('whoBia').classList.toggle('on', me==='bia');
}
document.getElementById('whoJose').addEventListener('click', ()=>{ me='jose'; localStorage.setItem('td_me','jose'); renderWho(); render(); });
document.getElementById('whoBia').addEventListener('click', ()=>{ me='bia'; localStorage.setItem('td_me','bia'); renderWho(); render(); });
renderWho();

function fmtDay(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return {num:d.getDate(), mon:MONTHS[d.getMonth()]};
}
function markSeen(set, key, storageKey){ set.add(key); localStorage.setItem(storageKey, JSON.stringify([...set])); }

function checkNotifications(){
  if(!('Notification' in window) || Notification.permission!=='granted' || !me) return;
  items.forEach(it=>{
    if(it.status==='pending' && it.proposed_by!==me && !seenProposal.has(it.id)){
      new Notification('Novo horário sugerido 💪', {
        body: `${NAME[it.proposed_by]} sugeriu ${it.date.split('-').reverse().join('/')} às ${it.time}. Você pode ir?`
      });
      markSeen(seenProposal, it.id, 'td_seen_proposal');
    }
    if(it.status!=='pending' && it.proposed_by===me && !seenResponse.has(it.id)){
      const txt = it.status==='confirmed' ? 'confirmou' : 'não pode ir n';
      new Notification(it.status==='confirmed' ? 'Confirmado! ✓' : 'Resposta recebida', {
        body: `${NAME[it.responded_by]} ${txt}esse horário (${it.date.split('-').reverse().join('/')} às ${it.time}).`
      });
      markSeen(seenResponse, it.id, 'td_seen_response');
    }
  });
}

function render(){
  const list = document.getElementById('list');
  const visible = items
    .filter(it=> it.status!=='declined')
    .filter(it=> new Date(it.date+'T'+it.time) >= new Date(Date.now()-60*60000))
    .sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time));
  if(!visible.length){ list.innerHTML='<div class="empty">Nenhuma sugestão ainda.</div>'; return; }
  list.innerHTML = visible.map(it=>{
    const d = fmtDay(it.date);
    const otherName = it.proposed_by==='jose' ? 'Bia' : 'José';
    const waMsg = encodeURIComponent(`Treino de academia: ${it.date.split('-').reverse().join('/')} às ${it.time}. Bora! 💪`);
    let noteLine, confirmRow='';
    if(it.status==='pending'){
      if(it.proposed_by===me){ noteLine = `Aguardando resposta de ${otherName}`; }
      else {
        noteLine = `${NAME[it.proposed_by]} sugeriu — você pode?`;
        confirmRow = `<div class="confirm-row">
          <button class="btn-yes" onclick="respond('${it.id}','confirmed')">Sim, posso</button>
          <button class="btn-no" onclick="respond('${it.id}','declined')">Não posso</button>
        </div>`;
      }
    } else { noteLine = 'Confirmado ✓ — Academia'; }
    return `<div class="item ${it.status==='pending'?'pending':''}">
      <div class="top">
        <div class="day">${d.num}<small>${d.mon}</small></div>
        <div class="info">
          <div class="time">${it.time}</div>
          <div class="note">${noteLine}</div>
        </div>
        <div class="actions">
          <button onclick="window.open('https://wa.me/?text=${waMsg}','_blank')" title="Enviar no WhatsApp">💬</button>
          <button class="del" onclick="removeItem('${it.id}')" title="Remover">✕</button>
        </div>
      </div>
      ${confirmRow}
    </div>`;
  }).join('');
}

async function loadAll(){
  const { data, error } = await supa.from(TABLE).select('*').order('date').order('time');
  if(error){
    document.getElementById('status').textContent = 'Erro ao carregar: ' + error.message;
    document.getElementById('status').classList.add('warn');
    return;
  }
  items = data || [];
  render();
  checkNotifications();
  document.getElementById('status').textContent = 'Sincronizado — os dois celulares veem os mesmos horários.';
}

function subscribeRealtime(){
  supa.channel('treino_sessions_changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: TABLE }, () => { loadAll(); })
    .subscribe();
}

loadAll();
subscribeRealtime();

document.getElementById('date').value = new Date().toISOString().slice(0,10);

document.getElementById('form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  if(!me){ alert('Toque em "José" ou "Bia" no topo antes de sugerir um horário.'); return; }
  const date = document.getElementById('date').value;
  const time = document.getElementById('time').value;
  const { error } = await supa.from(TABLE).insert({
    date, time, note:'Academia', status:'pending', proposed_by: me, responded_by:null
  });
  if(error){ alert('Não deu para enviar: ' + error.message); return; }
  document.getElementById('time').value = '';
});

window.respond = async (id, status)=>{
  const { error } = await supa.from(TABLE).update({ status, responded_by: me }).eq('id', id);
  if(error) alert('Erro: ' + error.message);
};
window.removeItem = async (id)=>{
  const { error } = await supa.from(TABLE).delete().eq('id', id);
  if(error) alert('Erro: ' + error.message);
};

const notifBtn = document.getElementById('notifBtn');
function updateNotifBtn(){
  if(!('Notification' in window)){ notifBtn.textContent='Notificações não suportadas'; notifBtn.disabled=true; return; }
  notifBtn.textContent = Notification.permission==='granted' ? 'Notificações ativadas ✓' : 'Ativar notificações neste navegador';
}
notifBtn.addEventListener('click', async ()=>{
  if(!('Notification' in window)) return;
  try{ await Notification.requestPermission(); }catch(e){}
  updateNotifBtn();
  checkNotifications();
});
updateNotifBtn();
setInterval(checkNotifications, 20000);

setTimeout(()=>{
  const splash = document.getElementById('splash');
  if(splash){
    splash.classList.add('hide');
    setTimeout(()=> splash.remove(), 600);
  }
}, 1500);
</script>
